<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RIFTRUNNER</title>
<style>
:root{--bg:#05070d;--ink:#e8f1ff;--dim:#8fa3bf;--acc:#6df0ff;--gold:#ffd23d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);font-family:"Segoe UI",Rubik,system-ui,Arial,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;background:#02030a}
#wrap{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#0b1020 0%,#02030a 75%)}
#c{position:absolute;display:block}
#uibg{position:absolute;inset:0;display:none;background:radial-gradient(ellipse at 50% 50%,rgba(4,7,16,.5) 0%,rgba(2,3,10,.82) 100%);backdrop-filter:blur(2px)}
#ui{position:absolute;left:50%;top:50%;width:640px;height:720px;display:none;flex-direction:column;transform-origin:center;transform:translate(-50%,-50%);overflow:hidden}
.center{margin:0;width:100%;height:100%;padding:18px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;text-align:center}
.center.wide{justify-content:flex-start;padding-top:16px;gap:9px}
.center>*{max-width:580px}
.logo{font-size:84px;font-weight:900;letter-spacing:6px;line-height:.92;filter:drop-shadow(0 0 22px rgba(109,240,255,.5))}
.logo .l1{background:linear-gradient(#ffffff,#9fb8d8);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .l2{background:linear-gradient(#b8fbff,#2fb8e8);-webkit-background-clip:text;background-clip:text;color:transparent;margin-left:8px}
.tag{letter-spacing:7px;font-size:12px;color:var(--dim);margin-bottom:14px}
.h1{font-size:34px;font-weight:800;letter-spacing:4px;text-shadow:0 0 18px rgba(109,240,255,.4)}
.h1.small{font-size:27px}.h1.win{color:#9dff5a;text-shadow:0 0 22px rgba(157,255,90,.5)}.h1.lose{color:#ff5a5a;text-shadow:0 0 22px rgba(255,90,90,.5)}
.sub{font-size:13px;color:var(--dim);letter-spacing:2px}
.menu{display:flex;flex-direction:column;gap:9px;width:310px}
.btn{position:relative;overflow:hidden;font:inherit;font-weight:700;font-size:15px;color:var(--ink);background:linear-gradient(180deg,rgba(40,62,104,.85),rgba(14,24,48,.9));border:1px solid rgba(110,150,230,.45);border-radius:8px;padding:10px 18px;cursor:pointer;min-height:44px;transition:.12s;box-shadow:0 2px 10px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12)}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-20deg);transition:left .45s}
.btn:hover::after,.btn:focus::after{left:130%}
.btn:hover,.btn:focus{outline:none;border-color:var(--acc);background:linear-gradient(180deg,rgba(54,92,150,.92),rgba(18,34,66,.95));box-shadow:0 0 18px rgba(109,240,255,.45),inset 0 1px 0 rgba(255,255,255,.2);color:#fff;transform:translateY(-1px)}
.btn.big{font-size:18px;padding:13px 20px}.btn.sm{font-size:12px;padding:6px 10px;min-height:32px}
.btn.danger{border-color:rgba(200,70,90,.6);background:linear-gradient(180deg,rgba(90,26,40,.9),rgba(40,12,22,.92))}.btn.danger:hover,.btn.danger:focus{border-color:#ff5a6a;box-shadow:0 0 18px rgba(255,90,106,.5)}
.btn.off,.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn .bd{font-weight:400;font-size:11px;color:var(--dim);margin-top:2px}
.stats{font-size:11px;color:var(--dim);margin-top:10px}.hint{font-size:10px;color:#5d7090;margin-top:4px}
.panel{background:linear-gradient(180deg,rgba(18,28,52,.78),rgba(8,12,26,.82));border:1px solid rgba(90,130,210,.3);border-radius:10px;padding:13px;width:100%;box-shadow:0 6px 24px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(6px)}
.panel.txt{text-align:left;font-size:13px;line-height:1.5}.panel.txt p{margin:0 0 8px}
.panel.form{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.sl{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px}.sl input{width:60%}
input[type=range]{accent-color:var(--acc)}
input.seed{font:inherit;font-size:13px;background:rgba(8,14,30,.9);color:#fff;border:1px solid #2c4170;border-radius:6px;padding:6px 9px;width:190px;user-select:text;-webkit-user-select:text}
.lbl{font-size:12px;color:var(--dim);max-width:460px}
.row3{display:flex;gap:10px;width:100%}
.card{flex:1;font:inherit;color:var(--ink);background:linear-gradient(180deg,rgba(20,32,58,.85),rgba(8,14,30,.9));border:1px solid rgba(80,110,180,.4);border-top:3px solid var(--c,#6df0ff);border-radius:8px;padding:11px 9px;cursor:pointer;text-align:center;transition:.12s;box-shadow:0 4px 16px rgba(0,0,0,.35)}
.card:hover,.card:focus{outline:none;box-shadow:0 0 20px var(--c,#6df0ff),0 4px 16px rgba(0,0,0,.35);border-color:var(--c,#6df0ff);transform:translateY(-2px)}
.card.sel{background:linear-gradient(180deg,rgba(30,56,96,.9),rgba(12,24,46,.95));box-shadow:0 0 16px var(--c,#6df0ff) inset,0 0 10px var(--c,#6df0ff)}
.card.locked{opacity:.45}
.card .cn{font-weight:800;font-size:15px;color:var(--c,#fff)}.card .cd{font-size:11px;color:#b9c7dd;margin-top:4px}.card .cs{font-size:10px;color:var(--dim);margin-top:6px}
.card.up{display:block;width:100%;flex:none;text-align:left;padding:12px 16px}.card.up .cn{font-size:17px}.card.up .cd{font-size:12.5px}
.card.up.cursed{background:linear-gradient(180deg,rgba(40,18,52,.9),rgba(20,8,28,.95))}
.ur{font-size:10px;letter-spacing:2px;color:var(--c);font-weight:700}
.syn{font-size:11px;color:#ffe066;margin-top:5px;opacity:.85}.syn.on{color:#fff;font-weight:700;opacity:1;text-shadow:0 0 8px #ffe066}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font:inherit;font-size:12px;font-weight:600;color:var(--ink);background:rgba(14,24,46,.9);border:1px solid rgba(80,110,180,.45);border-radius:14px;padding:5px 12px;cursor:pointer}
.chip:hover,.chip:focus{outline:none;border-color:var(--c,var(--acc));box-shadow:0 0 10px var(--c,var(--acc))}
.chip.sel{background:rgba(30,56,96,.95);border-color:var(--c,var(--acc));color:#fff}.chip:disabled{opacity:.35}
.btnrow{display:flex;gap:9px;align-items:center;justify-content:center;flex-wrap:wrap}
.scrapline{font-size:16px;color:var(--gold);font-weight:700;text-shadow:0 0 12px rgba(255,210,61,.4)}
.scroll{overflow-y:auto;width:100%;scrollbar-width:thin;scrollbar-color:#2c4170 transparent}
.list{flex:1;min-height:0;display:flex;flex-direction:column;gap:7px;padding-right:2px}
.rowitem{display:flex;gap:10px;align-items:center;justify-content:space-between;background:linear-gradient(90deg,rgba(18,28,52,.88),rgba(10,16,32,.88));border:1px solid rgba(70,100,170,.3);border-left:3px solid var(--c,#6df0ff);border-radius:7px;padding:9px 11px;text-align:left}
.rowitem.done{opacity:.55}.ri{flex:1;min-width:0}.rn{font-weight:700;font-size:13px;color:var(--c,#fff)}.rd{font-size:11px;color:#a9b8d0;margin-top:2px}
.rowitem .btn{flex:none;min-width:88px}
.secbanner{width:100%;border-top:3px solid var(--c);background:linear-gradient(180deg,rgba(18,28,52,.85),rgba(8,12,26,.8));padding:9px;border-radius:8px}
.secbanner .st{font-size:10px;letter-spacing:3px;color:var(--c)}.secbanner .sn{font-size:24px;font-weight:800}.secbanner .sb{font-size:11px;color:var(--dim)}
.maplist{flex:1;min-height:0;display:flex;flex-direction:column;gap:7px;padding:2px}
.maprow{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:8px}
.maprow.cur{background:rgba(109,240,255,.07);outline:1px solid rgba(109,240,255,.28)}
.ms{width:58px;font-size:9px;letter-spacing:1px;color:var(--dim);text-align:left;flex:none}
.cards{display:flex;gap:9px;flex:1;justify-content:center}
.node{font:inherit;flex:1;max-width:150px;color:var(--ink);background:linear-gradient(180deg,rgba(18,30,56,.9),rgba(8,14,30,.92));border:1px solid var(--c);border-radius:10px;padding:5px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-height:52px;justify-content:center;transition:.12s}
.node .ni{font-size:21px;color:var(--c);line-height:1.1;text-shadow:0 0 10px var(--c)}.node .nn{font-size:11px;font-weight:700}
.node:disabled{cursor:default;opacity:.55}
.node.now{opacity:1;box-shadow:0 0 14px var(--c);background:linear-gradient(180deg,rgba(26,44,80,.95),rgba(10,20,40,.95))}
.node.now:hover,.node.now:focus{outline:none;box-shadow:0 0 26px var(--c);transform:scale(1.05)}
.node.picked{opacity:.95;background:linear-gradient(180deg,rgba(22,56,36,.95),rgba(10,28,18,.95))}.node.missed{opacity:.2}.node.hidden{opacity:.35;border-style:dashed}
.hudmini{width:100%;background:linear-gradient(180deg,rgba(18,28,52,.85),rgba(8,12,26,.85));border:1px solid rgba(90,130,210,.28);border-radius:8px;padding:9px;text-align:left}
.ml{font-size:11px;color:#c7d4ea;margin-top:3px}
.ubar{position:relative;height:16px;background:#101828;border-radius:4px;overflow:hidden;line-height:16px}.ubar .fill{position:absolute;inset:0 auto 0 0;box-shadow:0 0 10px rgba(255,255,255,.2) inset}.ubar span{position:relative;display:block;font-size:10px;font-weight:700;line-height:16px;height:16px;padding-left:6px;text-align:left;text-shadow:0 1px 2px #000}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;max-height:54px;overflow:hidden}
.upill{font-size:9px;border:1px solid var(--c,#667);color:var(--c,#ccd);border-radius:9px;padding:1px 6px}.upill.syn{--c:#ffe066;margin:0;font-size:9px;opacity:1;color:#ffe066;border-color:#ffe066}
.seedtag{font-size:10px;color:#5d7090}
.txtblock{font-size:14px;line-height:1.5;color:#cfdcf0;max-width:420px;margin:4px 0 8px}
.cdesc{font-size:11.5px;color:#b9c7dd;margin-top:7px;line-height:1.4}.cen{font-size:10.5px;color:#ffe066;margin-top:7px}
.cmp{display:flex;gap:10px;width:100%}.cmpc{flex:1;background:linear-gradient(180deg,rgba(18,28,52,.88),rgba(8,12,26,.88));border:1px solid var(--c);border-radius:9px;padding:11px}.cmpc .cl{font-size:10px;letter-spacing:2px;color:var(--dim)}.cmpc .cn{font-weight:800;color:var(--c)}.cmpc .cd{font-size:12px}
.stat{padding:9px 15px}.srow{display:flex;justify-content:space-between;font-size:13px;padding:2px 0;border-bottom:1px solid rgba(40,56,100,.5)}.srow span{color:var(--dim)}
.scrapgain{font-size:30px;font-weight:900;color:var(--gold);text-shadow:0 0 20px rgba(255,210,61,.55)}
#toast{position:absolute;left:0;right:0;top:92px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:30}
.toastmsg{background:rgba(5,8,16,.92);border:1px solid #33456e;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;max-width:520px;text-align:center;animation:tin .25s;box-shadow:0 4px 18px rgba(0,0,0,.5)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.ibtn{position:absolute;z-index:40;width:28px;height:26px;font-size:13px;padding:0;background:rgba(8,14,30,.7);border:1px solid #2c4170;border-radius:6px;color:#fff;cursor:pointer}
.ibtn:hover{border-color:var(--acc)}
#touch{display:none;position:absolute;inset:0;pointer-events:none;z-index:35}
.tbtn{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(109,240,255,.14);border:2px solid rgba(109,240,255,.5);color:#fff;font:700 12px "Segoe UI",Arial;display:flex;align-items:center;justify-content:center;text-align:center;touch-action:none}
.tbtn.on{background:rgba(109,240,255,.45)}
#tb-special{width:64px;height:64px;right:18px;bottom:120px}
#tb-focus{width:64px;height:64px;right:92px;bottom:84px}
#tb-pause{width:36px;height:36px;left:10px;top:96px;font-size:14px}
#tb-repair,#tb-cell,#tb-bomb{width:36px;height:36px;bottom:110px;font-size:11px}#tb-repair{left:10px}#tb-cell{left:54px}#tb-bomb{left:98px;font-size:9px}
.catchip{margin-left:8px;letter-spacing:2px;font-size:10px;font-weight:700}
#ui.w2{width:980px}
.mapwrap{display:flex;gap:14px;width:100%;height:100%;padding:16px 18px}
.mapside{width:310px;flex:none;overflow-y:auto;text-align:left;background:linear-gradient(180deg,rgba(18,28,52,.88),rgba(8,12,26,.9));border:1px solid rgba(90,130,210,.3);border-radius:10px;padding:12px 13px;scrollbar-width:thin;scrollbar-color:#2c4170 transparent}
.center.wide .mapside{width:100%;max-height:300px}.center.wide .maplist{min-height:260px}.mapside.collapsedside{display:none}
.mapmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px;align-items:center;min-height:0}
.mapmain>.secbanner,.mapmain>.maplist{width:100%}
.ptitle{font-size:10px;letter-spacing:2px;color:var(--acc);margin:12px 0 5px;border-bottom:1px solid rgba(90,130,210,.25);padding-bottom:3px}.ptitle.first{margin-top:0}
.prow{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:2px 0;cursor:help}.prow .pl{color:var(--dim)}.prow .pv{font-weight:700;text-align:right}
.xpbar{height:4px;background:rgba(255,255,255,.12);border-radius:3px;margin:3px 0 2px;overflow:hidden;cursor:help}.xpbar i{display:block;height:100%;background:#ffe066}
.pills.full{max-height:none;overflow:visible}.upill{cursor:help}.upill.off{opacity:.45;text-decoration:line-through}
#tip{position:fixed;display:none;z-index:70;max-width:290px;background:rgba(6,10,22,.97);border:1px solid #3a5190;border-radius:8px;padding:8px 11px;font-size:12px;line-height:1.45;color:#dbe6fa;pointer-events:none;box-shadow:0 8px 28px rgba(0,0,0,.6);text-align:left}
#tip b{display:block;font-size:13px}#tip .tm{font-size:10px;letter-spacing:1.5px;opacity:.75;margin:1px 0 4px}#tip div+div{margin-top:3px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="uibg"></div>
  <div id="ui"></div>
  <div id="toast"></div>
  <div id="tip"></div>
  <button id="mutebtn" class="ibtn" title="Mute (M)">&#128266;</button>
  <button id="fsbtn" class="ibtn" title="Fullscreen (G)">&#9974;</button>
  <div id="touch">
    <div class="tbtn" id="tb-focus">FOCUS</div>
    <div class="tbtn" id="tb-special">SPECIAL</div>
    <div class="tbtn" id="tb-pause">II</div>
    <div class="tbtn" id="tb-repair">+HP</div>
    <div class="tbtn" id="tb-cell">NRG</div>
    <div class="tbtn" id="tb-bomb">BOMB</div>
  </div>
</div>
<script>
/*__JS__*/
</script>
</body>
</html>
